name: Test and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.13'
          python-version: '3.10'
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          import re
          from importlib.metadata import version
          from larkmd_sync import __version__, discover_builtin_skills

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH')
          skill = discover_builtin_skills('larkmd_sync.skills')['larkmd-sync']
          if not tag[1:] == version('larkmd-sync') == __version__ == skill.version:
              raise SystemExit('Tag, package, Python API and Skill versions must match')
          PY
      - name: Lint and test
        run: |
          uv run --locked ruff check src tests scripts
          uv run --locked python -m pytest -q
      - name: Build and check distributions
        run: |
          uv build
          uv run --locked python scripts/check_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Test installed wheel outside source tree
        run: |
          uv venv "$RUNNER_TEMP/wheel-env" --python 3.10
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m larkmd_sync --version
          "$RUNNER_TEMP/wheel-env/bin/python" -m larkmd_sync --json --no-input skill validate
          "$RUNNER_TEMP/wheel-env/bin/python" -m larkmd_sync --json --no-input skill install --dest "$RUNNER_TEMP/skills" --dry-run
          "$RUNNER_TEMP/wheel-env/bin/python" -m larkmd_sync --json --no-input skill install --dest "$RUNNER_TEMP/skills"
      - name: Generate release notes from commits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false
